http:
  routers:
    metrics-denied-file:
      rule: "PathRegexp(`^/api/(auth|users|committees|agenda|notifications|analytics|files|payments|raffles)/metrics/?$`)"
      entryPoints:
        - web
      service: auth-svc
      middlewares:
        - hide-public-metrics
      priority: 1000

    auth-file:
      rule: "PathPrefix(`/api/auth`)"
      entryPoints:
        - web
      service: auth-svc
      middlewares:
        - strip-auth
      priority: 310

    users-file:
      rule: "PathPrefix(`/api/users`)"
      entryPoints:
        - web
      service: users-svc
      middlewares:
        - strip-users
      priority: 300

    committees-file:
      rule: "PathPrefix(`/api/committees`)"
      entryPoints:
        - web
      service: users-svc
      middlewares:
        - strip-committees
      priority: 295

    agenda-file:
      rule: "PathPrefix(`/api/agenda`)"
      entryPoints:
        - web
      service: agenda-svc
      middlewares:
        - strip-agenda
      priority: 290

    notifications-file:
      rule: "PathPrefix(`/api/notifications`)"
      entryPoints:
        - web
      service: notifications-svc
      middlewares:
        - strip-notifications
      priority: 280

    analytics-file:
      rule: "PathPrefix(`/api/analytics`)"
      entryPoints:
        - web
      service: analytics-svc
      middlewares:
        - strip-analytics
      priority: 270

    files-file:
      rule: "PathPrefix(`/api/files`)"
      entryPoints:
        - web
      service: files-svc
      middlewares:
        - strip-files
      priority: 260

    payments-file:
      rule: "PathPrefix(`/api/payments`)"
      entryPoints:
        - web
      service: payments-svc
      middlewares:
        - strip-payments
      priority: 250

    raffles-file:
      rule: "PathPrefix(`/api/raffles`)"
      entryPoints:
        - web
      service: raffles-svc
      middlewares:
        - strip-raffles
      priority: 240

    frontend-file:
      rule: "PathPrefix(`/`)"
      entryPoints:
        - web
      service: frontend-svc
      priority: 1

  middlewares:
    # Azure sirve frontend y API bajo el mismo origen; no se emiten cabeceras
    # CORS wildcard incompatibles con cookies. Un origen cruzado futuro debe
    # declararse de forma exacta, nunca como `*` con credenciales.
    hide-public-metrics:
      replacePath:
        path: /__metrics_not_public__

    strip-auth:
      stripPrefix:
        prefixes:
          - /api/auth

    strip-users:
      stripPrefix:
        prefixes:
          - /api/users

    strip-committees:
      stripPrefix:
        prefixes:
          - /api/committees

    strip-agenda:
      stripPrefix:
        prefixes:
          - /api/agenda

    strip-notifications:
      stripPrefix:
        prefixes:
          - /api/notifications

    strip-analytics:
      stripPrefix:
        prefixes:
          - /api/analytics

    strip-files:
      stripPrefix:
        prefixes:
          - /api/files

    strip-payments:
      stripPrefix:
        prefixes:
          - /api/payments

    strip-raffles:
      stripPrefix:
        prefixes:
          - /api/raffles

  services:
    auth-svc:
      loadBalancer:
        passHostHeader: false
        servers:
          - url: "http://auth-service"

    users-svc:
      loadBalancer:
        passHostHeader: false
        servers:
          - url: "http://users-service"

    agenda-svc:
      loadBalancer:
        passHostHeader: false
        servers:
          - url: "http://agenda-service"

    notifications-svc:
      loadBalancer:
        passHostHeader: false
        servers:
          - url: "http://notifications-service"

    analytics-svc:
      loadBalancer:
        passHostHeader: false
        servers:
          - url: "http://analytics-service"

    files-svc:
      loadBalancer:
        passHostHeader: false
        servers:
          - url: "http://files-service"

    payments-svc:
      loadBalancer:
        passHostHeader: false
        servers:
          - url: "http://payments-service"

    raffles-svc:
      loadBalancer:
        passHostHeader: false
        servers:
          - url: "http://raffles-service"

    frontend-svc:
      loadBalancer:
        passHostHeader: false
        servers:
          - url: "http://frontend"
