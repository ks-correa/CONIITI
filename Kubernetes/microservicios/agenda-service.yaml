apiVersion: v1
kind: ConfigMap
metadata:
  name: agenda-service-config
data:
  RABBITMQ_HOST: "rabbitmq-service"
  RABBITMQ_USER: "user"
  AUTH_SERVICE_URL: "http://auth-service"
  FILES_SERVICE_URL: "http://files-service"
  AUTH_INTROSPECTION_ENABLED: "true"
  AGENDA_MEDIA_ALLOWED_HOSTS: ""
  ASSET_REFERENCE_RECONCILER_ENABLED: "true"
  ASSET_REFERENCE_POLL_SECONDS: "15"
  ASSET_REFERENCE_MAX_ATTEMPTS: "8"
  ASSET_REFERENCE_PROCESSING_LEASE_SECONDS: "120"
  AGENDA_EVENT_OUTBOX_ENABLED: "true"
  AGENDA_EVENT_OUTBOX_POLL_SECONDS: "10"
  ATTENDANCE_REQUIRE_REGISTRATION: "true"
  # Consumer-first: activar después de verificar las colas v2 y sus DLQ.
  ASISTENCIA_CONFIRMADA_ENABLED: "false"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agenda-service
  labels:
    app: agenda-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: agenda-service
  template:
    metadata:
      labels:
        app: agenda-service
    spec:
      containers:
      - name: agenda-service
        image: agenda-service:latest
        imagePullPolicy: IfNotPresent
        command: ["sh", "-c", "alembic upgrade head && exec uvicorn app.main:app --host 0.0.0.0 --port 8000"]
        resources:
          requests:
            memory: "64Mi"
            cpu: "40m"
          limits:
            memory: "176Mi"
            cpu: "250m"
        ports:
        - containerPort: 8000
        envFrom:
        - configMapRef:
            name: agenda-service-config
        - secretRef:
            name: agenda-service-secret
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 20
          periodSeconds: 15
        startupProbe:
          httpGet:
            path: /health
            port: 8000
          periodSeconds: 5
          failureThreshold: 30
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 8
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: agenda-service
spec:
  type: ClusterIP
  selector:
    app: agenda-service
  ports:
  - protocol: TCP
    port: 80
    targetPort: 8000
