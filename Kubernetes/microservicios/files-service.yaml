apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: files-uploads-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: files-service-config
data:
  AUTH_SERVICE_URL: "http://auth-service"
  FILES_MAX_IMAGE_BYTES: "26214400"
  FILES_MAX_VIDEO_BYTES: "536870912"
  FILES_MAX_DOCUMENT_BYTES: "52428800"
  FILES_IMPORT_LEGACY_JSON: "true"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: files-service
  labels:
    app: files-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: files-service
  template:
    metadata:
      labels:
        app: files-service
    spec:
      containers:
      - name: files-service
        image: files-service:latest
        imagePullPolicy: IfNotPresent
        command: ["sh", "-c", "alembic upgrade head && exec uvicorn app.main:app --host 0.0.0.0 --port 8000"]
        resources:
          requests:
            memory: "48Mi"
            cpu: "30m"
          limits:
            memory: "160Mi"
            cpu: "200m"
        ports:
        - containerPort: 8000
        envFrom:
        - configMapRef:
            name: files-service-config
        - secretRef:
            name: files-service-secret
        volumeMounts:
        - name: uploads-storage
          mountPath: /app/uploads
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 15
          periodSeconds: 15
        startupProbe:
          httpGet:
            path: /health
            port: 8000
          periodSeconds: 5
          failureThreshold: 30
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 10
      volumes:
      - name: uploads-storage
        persistentVolumeClaim:
          claimName: files-uploads-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: files-service
spec:
  type: ClusterIP
  selector:
    app: files-service
  ports:
  - protocol: TCP
    port: 80
    targetPort: 8000
